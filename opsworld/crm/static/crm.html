<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Contoso CRM</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,system-ui,Arial,sans-serif;background:#eef2f7;color:#13203a}
  header{background:#1e3a8a;color:#fff;padding:14px 24px;font-size:18px;font-weight:600}
  header small{font-weight:400;color:#c7d2fe;margin-left:8px;font-size:13px}
  .wrap{display:flex;gap:20px;padding:20px 24px}
  .col{background:#fff;border:1px solid #d9e2ef;border-radius:10px}
  .left{width:320px;flex:none} .right{flex:1;min-height:460px}
  .col h2{font-size:14px;margin:0;padding:14px 16px;border-bottom:1px solid #e5edf7;color:#334155}
  .pad{padding:16px} .muted{color:#64748b}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:7px;font-size:13px;font-family:inherit}
  .acct{padding:12px 16px;border-bottom:1px solid #f1f5f9;cursor:pointer}
  .acct:hover{background:#f8fafc} .acct .name{font-weight:600} .acct .sub{font-size:12px;color:#64748b}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;background:#e2e8f0;color:#334155}
  .pill.active{background:#dcfce7;color:#166534}.pill.churned{background:#fee2e2;color:#991b1b}.pill.suspended{background:#fef3c7;color:#92400e}
  .card{border:1px solid #e5edf7;border-radius:8px;padding:14px;margin-bottom:14px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  button{font-size:13px;padding:8px 14px;border-radius:7px;border:1px solid #cbd5e1;background:#fff;cursor:pointer}
  button.primary{background:#2563eb;color:#fff;border-color:#2563eb}
  .note{font-size:13px;padding:6px 0;border-bottom:1px solid #f1f5f9}
  label{font-size:12px;color:#475569;display:block;margin:10px 0 4px}
</style></head><body>
<header>Contoso CRM <small>customer relationship system</small></header>
<div class="wrap">
  <div class="col left"><h2>Accounts</h2>
    <div class="pad" style="padding:10px 12px;border-bottom:1px solid #e5edf7">
      <input id="search" placeholder="Search accounts by name, email, or ID..."/></div>
    <div id="list"></div></div>
  <div class="col right"><h2 id="title">Select an account</h2>
    <div class="pad" id="body"><span class="muted">Search for an account to begin.</span></div></div>
</div>
<script>
async function api(p,o){const r=await fetch(p,o);if(!r.ok)throw new Error((await r.json()).detail||r.statusText);return r.json()}
function hint(){document.getElementById('list').innerHTML='<div class="pad muted">Type to search accounts.</div>'}
function render(rows){const l=document.getElementById('list');l.innerHTML='';if(!rows.length){l.innerHTML='<div class="pad muted">No matches.</div>';return}
  for(const c of rows){const d=document.createElement('div');d.className='acct';d.innerHTML=`<div class="name">${c.name}</div><div class="sub">${c.account_id} · ${c.email} · <span class="pill ${c.status}">${c.status}</span></div>`;d.onclick=()=>openAcct(c.account_id);l.appendChild(d)}}
let t=null;document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim();clearTimeout(t);t=setTimeout(async()=>{if(!q){hint();return}render(await api('/api/search?q='+encodeURIComponent(q)))},200)});
async function openAcct(id){const d=await api('/api/accounts/'+id);const a=d.account;
  document.getElementById('title').textContent=`${a.name} (${a.account_id})`;
  let notes=d.cases.map(c=>`<div class="note">${c.created_at.slice(0,10)} — ${c.note}</div>`).join('')||'<div class="muted">No case notes.</div>';
  document.getElementById('body').innerHTML=`
    <div class="card"><div class="row"><div><b>Status</b></div><div><span class="pill ${a.status}">${a.status}</span></div></div>
      <div class="row" style="margin-top:6px"><div><b>Plan</b></div><div>${a.plan}</div></div>
      <div class="row" style="margin-top:6px"><div><b>Email</b></div><div>${a.email}</div></div></div>
    <div class="card"><b>Case notes</b>${notes}
      <label>Add a case note</label><textarea id="noteText" rows="2" placeholder="e.g. Stopped billing per churn reconciliation"></textarea>
      <div style="margin-top:8px"><button class="primary" onclick="addNote('${a.account_id}')">Add note</button></div></div>
    <div class="card"><b>Update status</b>
      <label>Set account status</label>
      <select id="statusSel"><option value="active" ${a.status==='active'?'selected':''}>active</option>
        <option value="churned" ${a.status==='churned'?'selected':''}>churned</option>
        <option value="suspended" ${a.status==='suspended'?'selected':''}>suspended</option></select>
      <div style="margin-top:8px"><button class="primary" onclick="updateStatus('${a.account_id}')">Update status</button></div></div>`;
}
async function addNote(id){const n=document.getElementById('noteText').value.trim();if(!n)return;await api('/api/add-note',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account_id:id,note:n})});openAcct(id)}
async function updateStatus(id){const s=document.getElementById('statusSel').value;await api('/api/update-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account_id:id,status:s})});openAcct(id)}
hint();
</script></body></html>
